name: Test and Build Delivery Images

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.34.5
  MSS_VERSION: v1.3.7

jobs:
  backend-unit:
    name: Go unit (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            directory: .
            go_sum: go.sum
          - name: tenant-platform
            directory: apps/tenant-platform
            go_sum: apps/tenant-platform/go.sum
          - name: mall-platform
            directory: apps/mall-platform
            go_sum: apps/mall-platform/go.sum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.go_sum }}
      - name: Run Go unit tests
        working-directory: ${{ matrix.directory }}
        run: GOWORK=off go test ./...

  frontend-unit:
    name: Admin Web unit (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            directory: web
          - name: tenant-platform
            directory: apps/tenant-platform/web
          - name: mall-platform
            directory: apps/mall-platform/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Install exact frontend dependencies
        run: corepack pnpm@${PNPM_VERSION} --dir "${{ matrix.directory }}" install --frozen-lockfile
      - name: Run frontend unit tests
        run: corepack pnpm@${PNPM_VERSION} --dir "${{ matrix.directory }}" test

  contracts:
    name: Contracts and project memory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack pnpm@${PNPM_VERSION} --dir web install --frozen-lockfile
      - name: Install exact MSS release tools
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/install-mss.sh" \
            "https://github.com/mss-boot-io/mss-boot-admin/releases/download/${MSS_VERSION}/install-mss.sh"
          bash "${RUNNER_TEMP}/install-mss.sh" \
            --version "${MSS_VERSION}" \
            --install-dir "${RUNNER_TEMP}/mss-bin"
          echo "${RUNNER_TEMP}/mss-bin" >> "${GITHUB_PATH}"
      - run: mss doctor --strict
      - run: tools/check-project-memory.sh
      - run: sh scripts/check-platform-boundaries.sh

  verify-delivery-images:
    name: Verify image (${{ matrix.name }})
    if: github.event_name != 'push'
    needs:
      - backend-unit
      - frontend-unit
      - contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tenant-platform
            context: apps/tenant-platform
            image: mss-shop-tenant-platform
          - name: mall-platform
            context: apps/mall-platform
            image: mss-shop-mall-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Verify delivery image builds
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}

  publish-delivery-images:
    name: Publish image (${{ matrix.name }})
    if: github.event_name == 'push'
    needs:
      - backend-unit
      - frontend-unit
      - contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tenant-platform
            context: apps/tenant-platform
            image: mss-shop-tenant-platform
          - name: mall-platform
            context: apps/mall-platform
            image: mss-shop-mall-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GHCR for branch builds
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build delivery image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
