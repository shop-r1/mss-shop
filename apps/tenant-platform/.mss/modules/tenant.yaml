apiVersion: mss.io/v1alpha1
kind: AdminModule
metadata:
    name: tenant
    displayName: 租户
    description: Manage tenant desired state and public storefront bindings. Delete only archives the control record; resource provisioning and destruction remain outside this module.
spec:
    entity:
        goName: Tenant
        table: biz_tenants
        idType: uuid
        timestamps: true
        softDelete: true
        fields:
            - name: displayName
              column: display_name
              goName: DisplayName
              displayName: 租户名称
              type: string
              required: true
              searchable: true
              sortable: true
              list: true
              form: true
              detail: true
              validation:
                minLength: 1
                maxLength: 200
              ui:
                component: input
            - name: slug
              column: slug
              goName: Slug
              displayName: 租户标识
              type: string
              required: true
              unique: true
              searchable: true
              sortable: true
              list: true
              form: true
              detail: true
              validation:
                minLength: 2
                maxLength: 63
                pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
              ui:
                component: input
            - name: desiredServing
              column: desired_serving
              goName: DesiredServing
              displayName: 期望对外服务
              type: bool
              required: true
              filterable: true
              list: true
              form: true
              detail: true
              default: true
              ui:
                component: switch
            - name: h5Host
              column: h5_host
              goName: H5Host
              displayName: H5 域名
              type: string
              required: true
              unique: true
              searchable: true
              list: true
              form: true
              detail: true
              validation:
                minLength: 1
                maxLength: 253
              ui:
                component: input
            - name: wechatAppId
              column: wechat_app_id
              goName: WechatAppID
              displayName: 微信 AppID
              type: string
              required: false
              searchable: true
              list: true
              form: true
              detail: true
              validation:
                maxLength: 64
              ui:
                component: input
            - name: defaultLocaleKey
              column: default_locale_key
              goName: DefaultLocaleKey
              displayName: 默认语言
              type: enum
              required: true
              filterable: true
              list: true
              form: true
              detail: true
              default: zh-cn
              enumValues:
                - value: zh-cn
                  label: 简体中文
                  labelEn: Simplified Chinese
                  color: blue
                - value: en-us
                  label: 英语
                  labelEn: English
                  color: cyan
              ui:
                component: select
            - name: defaultCurrency
              column: default_currency
              goName: DefaultCurrency
              displayName: 默认货币
              type: string
              required: true
              list: true
              form: true
              detail: true
              validation:
                minLength: 3
                maxLength: 3
                pattern: "^[A-Z]{3}$"
              ui:
                component: input
            - name: timeZone
              column: time_zone
              goName: TimeZone
              displayName: 时区
              type: string
              required: true
              list: true
              form: true
              detail: true
              validation:
                minLength: 1
                maxLength: 64
              ui:
                component: input
    api:
        basePath: /tenants
        version: v1
        operations:
            - create
            - delete
            - export
            - get
            - list
            - update
    permissions:
        - action: create
          displayName: Create Tenant
          defaultRoles:
            - admin
        - action: delete
          displayName: Archive Tenant Record
          defaultRoles:
            - admin
        - action: export
          displayName: Export Tenant
          defaultRoles:
            - admin
        - action: list
          displayName: List Tenant
          defaultRoles:
            - admin
        - action: read
          displayName: Read Tenant
          defaultRoles:
            - admin
        - action: update
          displayName: Update Tenant
          defaultRoles:
            - admin
    ownership:
        mode: none
        adminBypass: true
    menu:
        path: /tenants
        displayName: 租户管理
        displayNameEn: Tenants
        icon: table
    ui:
        list: true
        form: true
        detail: true
        mobile: true
        export: true
    events:
        - name: platform.tenant.created
          when: created
        - name: platform.tenant.updated
          when: updated
    tests:
        unit: true
        api: true
        e2e: true
        permissionMatrix: true
        migrationUpgrade: true
    generation:
        migrationID: "66966149766766"
        authorizationMigrationID: "66966149766767"
        backend: true
        frontend: true
        frontendTargets:
            - antd-v6
        docs: true
        tests: true
