apiVersion: v1
kind: Service
metadata:
  name: mss-shop-tenant-admin
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-tenant-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:Service:mss-shop-tenant-admin
    r1shop.io/full-git-sha: "0000000000000000000000000000000000000000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mss-shop-tenant-admin
    app.kubernetes.io/instance: tenant-admin-mss-shop-dev
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: ui
      port: 8001
      targetPort: ui
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mss-shop-tenant-admin
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-tenant-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:Ingress:mss-shop-tenant-admin
    r1shop.io/full-git-sha: "0000000000000000000000000000000000000000"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: tenant-admin.167.17.68.242.nip.io
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: mss-shop-tenant-admin
                port:
                  name: api
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: mss-shop-tenant-admin
                port:
                  name: api
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: mss-shop-tenant-admin
                port:
                  name: api
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mss-shop-tenant-admin
                port:
                  name: ui
