apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mss-shop-postgres
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-postgres
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:StatefulSet:mss-shop-postgres
    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  serviceName: mss-shop-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mss-shop-postgres
      app.kubernetes.io/instance: mss-shop-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mss-shop-postgres
        app.kubernetes.io/instance: mss-shop-dev
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: mss-shop
        r1shop.io/environment: dev
        r1shop.io/network-role: postgres
      annotations:
        r1shop.io/workload-binding: mss-shop-dev:StatefulSet:mss-shop-postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - hba_file=/etc/postgresql/config/pg_hba.conf
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
            - -c
            - ssl_ca_file=/etc/postgresql/tls/ca.crt
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - password_encryption=scram-sha-256
            - -c
            - listen_addresses=*
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mss-shop-postgres-auth
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mss-shop-postgres-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mss-shop-postgres-auth
                  key: password
          ports:
            - name: tls-postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -q -d "host=127.0.0.1 port=5432 sslmode=require user=$POSTGRES_USER dbname=$POSTGRES_DB"
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -q -d "host=127.0.0.1 port=5432 sslmode=require user=$POSTGRES_USER dbname=$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -q -d "host=127.0.0.1 port=5432 sslmode=require user=$POSTGRES_USER dbname=$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/config
              readOnly: true
            - name: init-security
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mss-shop-postgres-data
        - name: config
          configMap:
            name: mss-shop-postgres-config
        - name: init-security
          configMap:
            name: mss-shop-postgres-config
            defaultMode: 0555
            items:
              - key: init-security.sh
                path: 010-security.sh
        - name: tls
          secret:
            secretName: mss-shop-postgres-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: socket
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mss-shop-postgres
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-postgres
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:PodDisruptionBudget:mss-shop-postgres
    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mss-shop-postgres
      app.kubernetes.io/instance: mss-shop-dev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mss-shop-redis
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-redis
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:StatefulSet:mss-shop-redis
    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  serviceName: mss-shop-redis
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mss-shop-redis
      app.kubernetes.io/instance: mss-shop-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mss-shop-redis
        app.kubernetes.io/instance: mss-shop-dev
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: mss-shop
        r1shop.io/environment: dev
        r1shop.io/network-role: redis
      annotations:
        r1shop.io/workload-binding: mss-shop-dev:StatefulSet:mss-shop-redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.6.3-alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              password_hash="$(printf '%s' "${REDISCLI_AUTH}" | sha256sum | awk '{print $1}')"
              printf 'user default on ~* &* +@all #%s\n' "${password_hash}" > /run/redis/users.acl
              unset password_hash REDISCLI_AUTH
              exec redis-server /etc/redis/config/redis.conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: mss-shop-redis-auth
                  key: password
          ports:
            - name: tls-redis
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --tls --cacert /etc/redis/tls/ca.crt --sni mss-shop-redis.mss-shop-dev.svc -h 127.0.0.1 -p 6379 ping | grep -qx PONG
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --tls --cacert /etc/redis/tls/ca.crt --sni mss-shop-redis.mss-shop-dev.svc -h 127.0.0.1 -p 6379 ping | grep -qx PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --tls --cacert /etc/redis/tls/ca.crt --sni mss-shop-redis.mss-shop-dev.svc -h 127.0.0.1 -p 6379 ping | grep -qx PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis/config
              readOnly: true
            - name: auth-runtime
              mountPath: /run/redis
            - name: tls
              mountPath: /etc/redis/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mss-shop-redis-data
        - name: config
          configMap:
            name: mss-shop-redis-config
        - name: auth-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tls
          secret:
            secretName: mss-shop-redis-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
