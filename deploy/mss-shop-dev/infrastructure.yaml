# Isolated, additive infrastructure for the MSS development stage.
#
# This manifest owns only resources in the new `mss-shop-dev` namespace. It
# neither selects nor mutates any object in `r1shop-dev`. The sole reference to
# the legacy development database is a NetworkPolicy peer that permits a
# separately reviewed `legacy-import` Pod to make a source-side read-only
# connection. Database privileges remain an independent import credential
# contract.
#
# Do not apply this file directly. The trusted create-only infrastructure
# operator owns this exact 24-object inventory. It persists NetworkPolicies,
# creates two non-mounting scheduler binder Pods, and always ends that binding
# invocation before any StatefulSet. If either PVC is Pending, it remains
# stopped until provisioning completes. A later exact retry admits either
# StatefulSet only after both PVs pass stable cluster-wide node/path exclusivity
# checks.
# Operator implementation and legacy snapshot import are separate delivery
# gates.
#
# After that infrastructure stage, provision these namespace-local foundation
# Secrets so the deliberately Pending datastore Pods can start. This file
# contains no Secret values or Secret objects:
#
#   mss-shop-postgres-auth: username, password, database
#   mss-shop-postgres-tls:  tls.crt, tls.key, ca.crt
#   mss-shop-redis-auth:    password
#   mss-shop-redis-tls:     tls.crt, tls.key, ca.crt
#
# TLS certificates must cover the corresponding short Service name and its
# `mss-shop-dev.svc` / `mss-shop-dev.svc.cluster.local` DNS names.
apiVersion: v1
kind: Namespace
metadata:
  name: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-dev
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.32
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.32
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.32
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:Namespace:mss-shop-dev
    r1shop.io/infrastructure-contract: isolated-dev-v1
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mss-shop-dev-quota
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-dev-guardrails
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:ResourceQuota:mss-shop-dev-quota
    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    requests.storage: 12Gi
    requests.ephemeral-storage: 2Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    limits.ephemeral-storage: 4Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "2"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mss-shop-dev-defaults
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-dev-guardrails
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:LimitRange:mss-shop-dev-defaults
    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 5m
        memory: 32Mi
        ephemeral-storage: 32Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
      min:
        cpu: 1m
        memory: 8Mi
        ephemeral-storage: 8Mi
      max:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 1Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mss-shop-postgres-config
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-postgres
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:ConfigMap:mss-shop-postgres-config
    r1shop.io/infrastructure-contract: isolated-dev-v1
data:
  pg_hba.conf: |
    local   all   all                         trust
    hostnossl all all 0.0.0.0/0               reject
    hostnossl all all ::/0                    reject
    hostssl all all 0.0.0.0/0                 scram-sha-256
    hostssl all all ::/0                      scram-sha-256
  # The official image runs this only while initializing a fresh PGDATA. A
  # collision-safe operator must reject a pre-existing unbound PVC and must
  # independently verify these ACLs before admitting application workloads.
  init-security.sh: |
    #!/bin/sh
    set -eu

    if [ "${POSTGRES_DB}" != "mss_shop_dev" ]; then
      echo "refusing unexpected isolated database name" >&2
      exit 1
    fi

    psql --no-password --set=ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname postgres <<'SQL'
    REVOKE ALL ON DATABASE mss_shop_dev FROM PUBLIC;
    REVOKE ALL ON DATABASE postgres FROM PUBLIC;
    REVOKE ALL ON DATABASE template1 FROM PUBLIC;
    COMMENT ON DATABASE mss_shop_dev IS 'r1shop.io/operator-binding=mss-shop-dev:PostgreSQL:mss_shop_dev;state=isolated-empty';
    SQL

    for database_name in mss_shop_dev postgres template1; do
      psql --no-password --set=ON_ERROR_STOP=1 --set=bootstrap_user="${POSTGRES_USER}" --username "${POSTGRES_USER}" --dbname "${database_name}" <<'SQL'
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    ALTER SCHEMA public OWNER TO :"bootstrap_user";
    SQL
    done
---
