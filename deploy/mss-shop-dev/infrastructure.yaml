apiVersion: v1
kind: Pod
metadata:
  name: mss-shop-postgres-storage-binder
  namespace: mss-shop-dev
  labels:
    app.kubernetes.io/name: mss-shop-postgres-storage-binder
    app.kubernetes.io/instance: mss-shop-dev
    app.kubernetes.io/component: storage-binding
    app.kubernetes.io/part-of: mss-shop
    app.kubernetes.io/managed-by: r1shop-operator
    r1shop.io/environment: dev
    r1shop.io/network-role: storage-binder
  annotations:
    r1shop.io/operator-binding: mss-shop-dev:Pod:mss-shop-postgres-storage-binder
    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: storage-binder
      image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - exit 0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 1m
          memory: 8Mi
          ephemeral-storage: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
          ephemeral-storage: 32Mi
  # Deliberately no volumeMounts: the scheduler sees the claim and triggers
  # WaitForFirstConsumer provisioning, while the process cannot access data.
  volumes:
    - name: data-binding-only
      persistentVolumeClaim:
        claimName: mss-shop-postgres-data
        readOnly: true
