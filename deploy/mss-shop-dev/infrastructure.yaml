    r1shop.io/infrastructure-contract: isolated-dev-v1
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        # This cluster's kubelet injects the Calico-compatible NodeLocal DNS
        # listener below into Pod resolv.conf. The /32 is intentionally fixed;
        # an operator preflight must fail if the cluster DNS address drifts.
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
