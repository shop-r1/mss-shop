version: 1
invariants:
  - id: TEN-001
    statement: A client cannot select or provide a database schema.
    owner: platform
    decision: DEC-0002
    enforced_by: [tenant-resolver, connection-registry, security-tests]
  - id: TEN-002
    statement: A mall runtime is bound at startup to one tenant and one core/business schema pair.
    owner: mall-platform
    decision: DEC-0002
    enforced_by: [runtime-config-validation, readiness-check]
  - id: TEN-003
    statement: Public Host or AppID bindings can select public bootstrap data but never authenticate a caller or select a schema.
    owner: storefront-api
    decision: DEC-0005
    enforced_by: [exact-binding-directory, bootstrap-negative-tests, customer-session-verification]
  - id: REC-001
    statement: Only the one-time legacy importer mutates the initial isolated public-table snapshot; only the database reconciler mutates tenant roles, schemas, snapshots, views or grants; only fixed trusted operators mutate isolated Secrets or workload objects.
    owner: legacy-importer-reconciler-and-stage-operator
    decision: DEC-0010
    enforced_by: [compiled-import-inventory, receipt-marker, trigger-disabled-database-preflight, exact-database-service-binding, database-roles, no-service-account-token, operator-collision-preflight, audit-log]
  - id: REC-002
    statement: Reconciliation requires the exact persisted import receipt marker and independent zero-row checks for orders and order_goods; missing or mismatched evidence fails closed.
    owner: reconciler
    decision: DEC-0010
    enforced_by: [receipt-sha256-binding, disposable-pod-verification, single-transaction-plan, advisory-lock, fixed-development-target-guard]
  - id: ENV-001
    statement: The original r1shop-dev environment is immutable; the only development write target is mss-shop-dev with dedicated PostgreSQL, Redis, PVCs, TLS, credentials and network policy.
    owner: platform-operations
    decision: DEC-0010
    enforced_by: [create-only-24-object-operator, network-policies-before-storage-binders, inert-storage-binders-before-statefulsets, exclusive-node-local-path-gate, six-immutable-foundation-secrets, fixed-namespace-guards]
  - id: ENV-002
    statement: Old-environment access is limited to the exact read-only legacy database source and GET of its credential and the exact GHCR pull Secret; old Redis and every old-environment write are forbidden.
    owner: platform-operations
    decision: DEC-0010
    enforced_by: [fixed-source-endpoint, source-read-only-transaction, source-plaintext-exception, exact-source-egress-policy, exact-secret-get-allowlist]
  - id: API-001
    statement: Storefront clients use /app/v1 and never use the MSS Admin API.
    owner: storefront-api
    decision: DEC-0003
    enforced_by: [openapi-contract, gateway-routes, client-build]
  - id: DATA-001
    statement: Legacy business tables are accessed only through startup-bound schema-qualified repositories and never through a request-selected or unqualified table name.
    owner: mall-platform
    decision: DEC-0007
    enforced_by: [legacy-manifest, qualified-repository, readiness-fingerprint, schema-negative-tests]
  - id: DATA-002
    statement: The authoritative legacy inventory contains 54 tables; the isolated importer copies 51 business tables, keeps orders and order_goods target-empty, and does not copy roles, tenants or users.
    owner: data-migration
    decision: DEC-0010
    enforced_by: [legacy-manifest, compiled-import-manifest, schema-inventory-test, receipt-row-count-and-hash-check, order-empty-check]
  - id: DATA-003
    statement: All current legacy Admin compatibility resources are read-only, and JSON documents with declared nested secrets cannot be searched, filtered, or sorted.
    owner: tenant-platform-and-mall-platform
    decision: DEC-0007
    enforced_by: [capability-manifest, mutation-negative-tests, nested-secret-query-negative-tests]
  - id: DATA-004
    statement: Product masters and logistics rules are tenant-owned data in each fixed mall business schema; the tenant platform owns no cross-tenant catalog or logistics writer.
    owner: mall-platform
    decision: DEC-0009
    enforced_by: [legacy-manifest, ownership-contract-tests, fixed-schema-binding, migration-reconciliation]
  - id: I18N-001
    statement: User-visible text, including authorized dynamic menus, is selected by a locale key and never used as a business or error code.
    owner: all-ui
    decision: DEC-0004
    enforced_by: [locale-catalog-check, menu-runtime-contract, in-app-browser-review]
  - id: OPS-001
    statement: Production writes require explicit approval for the exact action.
    owner: platform-operations
    decision: null
    enforced_by: [AGENTS.md, review]
